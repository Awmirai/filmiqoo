name: Product 0.9 native visual audit
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'scripts/run-product-audit.sh', 'scripts/prepare-test-device.sh', '.github/workflows/product-audit-090.yml']
concurrency:
  group: product-audit-090-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        batch: [core, large, landscape, access]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILMIQOO_DEBUG_API_BASE_URL: https://api.filmiqo.com
      FILMIQOO_LEGACY_SERVER_PREVIEW: 'true'
      FILMIQOO_AUDIT_STAGE: after
      FILMIQOO_AUDIT_TEST_CLASS: com.filmiqoo.app.ProductAudit090Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare emulator output
        run: touch /tmp/filmiqoo-qemu.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu lavapipe -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -verbose -stdouterr-file /tmp/filmiqoo-qemu.log
          script: |
            bash scripts/prepare-test-device.sh
            mkdir -p audit-evidence
            bash scripts/run-product-audit.sh "${{ matrix.batch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-audit-090-after-${{ matrix.batch }}
          path: |
            audit-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
