name: Production Contract Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/production/**"
      - ".github/workflows/production-release.yml"
      - ".github/workflows/production-contract.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "deploy/production/**"
      - ".github/workflows/production-release.yml"
      - ".github/workflows/production-contract.yml"

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment scripts
        working-directory: deploy/production
        run: |
          bash -n backup.sh
          bash -n restore.sh
          bash -n rollback.sh

      - name: Validate production compose
        working-directory: deploy/production
        env:
          FILMIQOO_API_ENV_FILE: .env.production.example
        run: |
          docker compose             --env-file .env.production.example             -f docker-compose.yml             config >/tmp/filmiqoo-compose.yml
          test -s /tmp/filmiqoo-compose.yml

      - name: Build production backend container
        run: docker build -t filmiqoo-api:contract ./backend
