name: Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name (for example 1.0.0)"
        required: true
        type: string
      version_code:
        description: "Android version code"
        required: true
        type: number
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/awmirai/filmiqoo-api:${{ github.sha }}
            ghcr.io/awmirai/filmiqoo-api:release
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "FILMIQOO_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "FILMIQOO_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "FILMIQOO_VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
            echo "FILMIQOO_VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"
          fi

      - name: Validate production release configuration
        shell: bash
        env:
          FILMIQOO_RELEASE_API_BASE_URL: ${{ vars.FILMIQOO_RELEASE_API_BASE_URL }}
          FILMIQOO_FIREBASE_API_KEY: ${{ vars.FILMIQOO_FIREBASE_API_KEY }}
          FILMIQOO_FIREBASE_APP_ID: ${{ vars.FILMIQOO_FIREBASE_APP_ID }}
          FILMIQOO_FIREBASE_PROJECT_ID: ${{ vars.FILMIQOO_FIREBASE_PROJECT_ID }}
          FILMIQOO_FIREBASE_SENDER_ID: ${{ vars.FILMIQOO_FIREBASE_SENDER_ID }}
          FILMIQOO_KEYSTORE_BASE64: ${{ secrets.FILMIQOO_KEYSTORE_BASE64 }}
          FILMIQOO_KEYSTORE_PASSWORD: ${{ secrets.FILMIQOO_KEYSTORE_PASSWORD }}
          FILMIQOO_KEY_ALIAS: ${{ secrets.FILMIQOO_KEY_ALIAS }}
          FILMIQOO_KEY_PASSWORD: ${{ secrets.FILMIQOO_KEY_PASSWORD }}
        run: |
          test -n "$FILMIQOO_RELEASE_API_BASE_URL"
          [[ "$FILMIQOO_RELEASE_API_BASE_URL" == https://* ]]
          test -n "$FILMIQOO_FIREBASE_API_KEY"
          test -n "$FILMIQOO_FIREBASE_APP_ID"
          test -n "$FILMIQOO_FIREBASE_PROJECT_ID"
          test -n "$FILMIQOO_FIREBASE_SENDER_ID"
          test -n "$FILMIQOO_KEYSTORE_BASE64"
          test -n "$FILMIQOO_KEYSTORE_PASSWORD"
          test -n "$FILMIQOO_KEY_ALIAS"
          test -n "$FILMIQOO_KEY_PASSWORD"

      - name: Decode Android signing keystore
        shell: bash
        env:
          FILMIQOO_KEYSTORE_BASE64: ${{ secrets.FILMIQOO_KEYSTORE_BASE64 }}
        run: |
          echo "$FILMIQOO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/filmiqoo-release.jks"

      - name: Build signed APK and AAB
        env:
          FILMIQOO_REQUIRE_SIGNING: "true"
          FILMIQOO_KEYSTORE_PATH: ${{ runner.temp }}/filmiqoo-release.jks
          FILMIQOO_KEYSTORE_PASSWORD: ${{ secrets.FILMIQOO_KEYSTORE_PASSWORD }}
          FILMIQOO_KEY_ALIAS: ${{ secrets.FILMIQOO_KEY_ALIAS }}
          FILMIQOO_KEY_PASSWORD: ${{ secrets.FILMIQOO_KEY_PASSWORD }}
          FILMIQOO_APPLICATION_ID: ${{ vars.FILMIQOO_APPLICATION_ID }}
          FILMIQOO_RELEASE_API_BASE_URL: ${{ vars.FILMIQOO_RELEASE_API_BASE_URL }}
          FILMIQOO_FIREBASE_API_KEY: ${{ vars.FILMIQOO_FIREBASE_API_KEY }}
          FILMIQOO_FIREBASE_APP_ID: ${{ vars.FILMIQOO_FIREBASE_APP_ID }}
          FILMIQOO_FIREBASE_PROJECT_ID: ${{ vars.FILMIQOO_FIREBASE_PROJECT_ID }}
          FILMIQOO_FIREBASE_SENDER_ID: ${{ vars.FILMIQOO_FIREBASE_SENDER_ID }}
        run: gradle :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Generate release checksums
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/release/*.apk > release-sha256.txt
          sha256sum app/build/outputs/bundle/release/*.aab >> release-sha256.txt
          cat release-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: filmiqoo-production-android-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-sha256.txt
          if-no-files-found: error
