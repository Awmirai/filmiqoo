name: Source Review Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/source-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source and inventory
        run: |
          git rev-parse HEAD > source-commit.txt
          git ls-files > source-inventory.txt
          git archive --format=tar.gz -o source-review.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-review-${{ github.sha }}
          path: |
            source-review.tar.gz
            source-inventory.txt
            source-commit.txt
          retention-days: 1
          if-no-files-found: error
