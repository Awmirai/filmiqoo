name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filmiqoo_ci
          POSTGRES_USER: filmiqoo
          POSTGRES_PASSWORD: filmiqoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmiqoo -d filmiqoo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://filmiqoo:filmiqoo@localhost:5432/filmiqoo_ci?sslmode=disable
      PGPASSWORD: filmiqoo
      REDIS_ADDR: localhost:6379
      FILMIQOO_E2E: "1"
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: filmiqoo-ci
      OBJECT_STORAGE_KEY: filmiqoo-ci
      OBJECT_STORAGE_SECRET: filmiqoo-ci-secret-password
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO object storage
        run: |
          docker run -d --name filmiqoo-minio             -p 9000:9000             -e MINIO_ROOT_USER=filmiqoo-ci             -e MINIO_ROOT_PASSWORD=filmiqoo-ci-secret-password             quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs filmiqoo-minio
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare and verify Go modules
        run: |
          go mod tidy
          go mod verify

      - name: Apply embedded database migrations
        run: go run ./cmd/migrate

      - name: Unit tests with race detector
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...
