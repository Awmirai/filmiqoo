name: Build Filmiqoo Premium Preview APK

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FILMIQOO_DEBUG_API_BASE_URL: https://api.filmiqo.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Print Android lint report
        if: always()
        run: |
          report="$(find app/build -name 'lint-results-debug.txt' -print -quit)"
          if [ -n "$report" ] && [ -f "$report" ]; then
            echo "Lint report: $report"
            cat "$report"
          fi

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/intermediates/**/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build minified release smoke
        env:
          FILMIQOO_RELEASE_API_BASE_URL: https://release-smoke.invalid
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: filmiqoo-premium-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  experience-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise cinema UI on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.filmiqoo.previewfix/files/cinema-screenshots cinema-screenshots
      - name: Upload device test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-device-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            cinema-screenshots/
          if-no-files-found: warn
