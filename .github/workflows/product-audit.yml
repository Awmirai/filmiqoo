name: Product visual audit
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', '.github/workflows/product-audit.yml']
concurrency:
  group: product-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        stage: [before, after]
        batch: [core, large, landscape, access]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILMIQOO_DEBUG_API_BASE_URL: https://api.filmiqo.com
      FILMIQOO_LEGACY_SERVER_PREVIEW: 'true'
      FILMIQOO_AUDIT_STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve identical baseline harness
        if: matrix.stage == 'before'
        run: |
          cp app/src/androidTest/java/com/filmiqoo/app/ProductAuditTest.kt /tmp/ProductAuditTest.kt
          cp app/src/androidTest/java/com/filmiqoo/app/NativeEvidenceGuard.kt /tmp/NativeEvidenceGuard.kt
          git restore --source=cdaa9feb816547feee90c874af6b821e445bdf33 --staged --worktree -- app
          cp /tmp/ProductAuditTest.kt app/src/androidTest/java/com/filmiqoo/app/ProductAuditTest.kt
          cp /tmp/NativeEvidenceGuard.kt app/src/androidTest/java/com/filmiqoo/app/NativeEvidenceGuard.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/androidTest/java/com/filmiqoo/app/ProductAuditTest.kt')
          s = p.read_text().replace('PartyLobbyScreen(backend,{_,_->},{},{})', 'ConnectedWatchPartyScreen(null,backend=backend,social=SocialRepository(backend),repository=repository,onBack={},onRequireAuth={})')
          s = s.replace('"profile" -> AuditProfile(backend,repository)', '"profile" -> CinemaLibraryScreen(backend,repository,{},{},{},showBack=false)')
          s = s.replace('onLoggedOut={},loggedIn=false)', 'onLoggedOut={})')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare emulator output capture
        run: touch /tmp/filmiqoo-qemu.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu lavapipe -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -verbose -stdouterr-file /tmp/filmiqoo-qemu.log
          script: |
            bash scripts/prepare-test-device.sh
            mkdir -p audit-evidence
            bash scripts/run-product-audit.sh "${{ matrix.batch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-audit-${{ matrix.stage }}-${{ matrix.batch }}
          path: |
            audit-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
