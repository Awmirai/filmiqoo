name: Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: filmiqoo-staging-deploy
  cancel-in-progress: false

jobs:
  build-api:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable staging API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/awmirai/filmiqoo-api:${{ github.sha }}
            ghcr.io/awmirai/filmiqoo-api:staging
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-api
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging deployment configuration
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          FILMIQOO_STAGING_BASE_URL: ${{ vars.FILMIQOO_STAGING_BASE_URL }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_ENV_FILE_BASE64: ${{ secrets.STAGING_ENV_FILE_BASE64 }}
          STAGING_OPS_SECRET: ${{ secrets.STAGING_OPS_SECRET }}
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_SSH_USER"
          test -n "$STAGING_SSH_PORT"
          test -n "$STAGING_DEPLOY_DIR"
          test -n "$FILMIQOO_STAGING_BASE_URL"
          [[ "$FILMIQOO_STAGING_BASE_URL" == https://* ]]
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_KNOWN_HOSTS"
          test -n "$STAGING_ENV_FILE_BASE64"
          test -n "$STAGING_OPS_SECRET"

      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare private staging environment
        env:
          STAGING_ENV_FILE_BASE64: ${{ secrets.STAGING_ENV_FILE_BASE64 }}
          STAGING_OPS_SECRET: ${{ secrets.STAGING_OPS_SECRET }}
          FILMIQOO_STAGING_BASE_URL: ${{ vars.FILMIQOO_STAGING_BASE_URL }}
        run: |
          printf '%s' "$STAGING_ENV_FILE_BASE64" | base64 --decode > /tmp/.env.staging.raw
          grep -Ev '^(FILMIQOO_API_IMAGE|FILMIQOO_VERSION|FILMIQOO_COMMIT)=' /tmp/.env.staging.raw > /tmp/.env.staging
          {
            echo "FILMIQOO_API_IMAGE=ghcr.io/awmirai/filmiqoo-api:${GITHUB_SHA}"
            echo "FILMIQOO_VERSION=staging-${GITHUB_SHA:0:12}"
            echo "FILMIQOO_COMMIT=${GITHUB_SHA}"
          } >> /tmp/.env.staging
          chmod 600 /tmp/.env.staging
          grep -Fx 'APP_ENV=production' /tmp/.env.staging >/dev/null
          grep -Fx "PUBLIC_API_BASE_URL=$FILMIQOO_STAGING_BASE_URL" /tmp/.env.staging >/dev/null
          env_ops="$(grep -E '^OPS_SECRET=' /tmp/.env.staging | tail -n1 | cut -d= -f2-)"
          test "$env_ops" = "$STAGING_OPS_SECRET"
          if grep -Eq 'replace-with|<commit-sha>|example\.com' /tmp/.env.staging; then
            echo "Staging env still contains placeholder values."
            exit 1
          fi

      - name: Preserve previous staging environment
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          DIR: ${{ vars.STAGING_DEPLOY_DIR }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p '$DIR' && if [ -s '$DIR/.env.staging' ]; then cp '$DIR/.env.staging' '$DIR/.env.staging.rollback'; fi"

      - name: Upload staging deployment bundle
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          DIR: ${{ vars.STAGING_DEPLOY_DIR }}
        run: |
          scp -P "$PORT" deploy/staging/docker-compose.yml deploy/staging/Caddyfile deploy/staging/deploy.sh "$USER@$HOST:$DIR/"
          scp -P "$PORT" /tmp/.env.staging "$USER@$HOST:$DIR/.env.staging"
          ssh -p "$PORT" "$USER@$HOST" "chmod 700 '$DIR/deploy.sh' && chmod 600 '$DIR/.env.staging'"

      - name: Authenticate staging host to GHCR
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$PORT" "$USER@$HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy staging candidate
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          DIR: ${{ vars.STAGING_DEPLOY_DIR }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" "cd '$DIR' && ./deploy.sh"

      - name: External HTTPS staging smoke
        env:
          FILMIQOO_STAGING_BASE_URL: ${{ vars.FILMIQOO_STAGING_BASE_URL }}
          FILMIQOO_STAGING_OPS_SECRET: ${{ secrets.STAGING_OPS_SECRET }}
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          DIR: ${{ vars.STAGING_DEPLOY_DIR }}
        run: |
          if ! bash deploy/staging/smoke.sh; then
            echo "External smoke failed; rolling staging back."
            ssh -p "$PORT" "$USER@$HOST" "cd '$DIR' && ./deploy.sh --rollback" || true
            exit 1
          fi

      - name: Log staging host out of GHCR
        if: always()
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_SSH_USER }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" "docker logout ghcr.io >/dev/null 2>&1 || true" || true

  android-staging:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build staging Android APK
        env:
          FILMIQOO_DEBUG_API_BASE_URL: ${{ vars.FILMIQOO_STAGING_BASE_URL }}
          FILMIQOO_APPLICATION_ID: ${{ vars.FILMIQOO_STAGING_APPLICATION_ID }}
          FILMIQOO_FIREBASE_API_KEY: ${{ vars.FILMIQOO_STAGING_FIREBASE_API_KEY }}
          FILMIQOO_FIREBASE_APP_ID: ${{ vars.FILMIQOO_STAGING_FIREBASE_APP_ID }}
          FILMIQOO_FIREBASE_PROJECT_ID: ${{ vars.FILMIQOO_STAGING_FIREBASE_PROJECT_ID }}
          FILMIQOO_FIREBASE_SENDER_ID: ${{ vars.FILMIQOO_STAGING_FIREBASE_SENDER_ID }}
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: filmiqoo-staging-android-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
