name: Android APK

on:
  push:
    branches:
      - ui-player-stability
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production API commit
        run: |
          echo "Production API health:"
          curl --fail --show-error --silent --max-time 15 https://api.filmiqo.com/healthz
          echo

  build:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android build
        env:
          FILMIQOO_DEBUG_API_BASE_URL: https://api.filmiqo.com
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Filmiqoo-latest
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
