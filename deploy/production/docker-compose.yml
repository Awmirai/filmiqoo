services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filmiqoo}
      POSTGRES_USER: ${POSTGRES_USER:-filmiqoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmiqoo} -d ${POSTGRES_DB:-filmiqoo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data

  api:
    image: ${FILMIQOO_API_IMAGE:?FILMIQOO_API_IMAGE must be set}
    restart: unless-stopped
    env_file:
      - ${FILMIQOO_API_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-filmiqoo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-filmiqoo}
      ALLOW_INTERNAL_PLAINTEXT_DATABASE: "true"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: https://${FILMIQOO_MEDIA_DOMAIN}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-filmiqoo-media}
      OBJECT_STORAGE_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET: ${MINIO_ROOT_PASSWORD}
      PUBLIC_MEDIA_BASE_URL: https://${FILMIQOO_MEDIA_DOMAIN}/${OBJECT_STORAGE_BUCKET:-filmiqoo-media}
      BUILD_VERSION: ${FILMIQOO_VERSION:?FILMIQOO_VERSION is required}
      BUILD_COMMIT: ${FILMIQOO_COMMIT:?FILMIQOO_COMMIT is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 20s
      timeout: 3s
      start_period: 20s
      retries: 8

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FILMIQOO_DOMAIN: ${FILMIQOO_DOMAIN:?FILMIQOO_DOMAIN is required}
      FILMIQOO_MEDIA_DOMAIN: ${FILMIQOO_MEDIA_DOMAIN:?FILMIQOO_MEDIA_DOMAIN is required}
      FILMIQOO_TLS_EMAIL: ${FILMIQOO_TLS_EMAIL:?FILMIQOO_TLS_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
